name: Rolling Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          persist-credentials: false # GITHUB_TOKEN 사용 안 함

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html  # SPA 대응

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: asksa1256/rolling
          publish_branch: gh-pages
          publish_dir: ./dist
